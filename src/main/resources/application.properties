spring.application.name=networkplan
server.port=8080

# ============================================================
#  Java 21 virtual threads
#  Every HTTP request and every @Async task runs on a virtual
#  thread: blocking JDBC / Redis calls no longer pin a platform
#  thread, so the fan-out in DispatchBoardService scales.
# ============================================================
spring.threads.virtual.enabled=true

# ============================================================
#  PostgreSQL 18  (pgAdmin 4 -> Servers -> PostgreSQL 18)
#  Override the password without touching this file:
#    setx DB_PASSWORD "yourPassword"
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/networkplan
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=networkplan-pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  Flyway — the schema is owned by the versioned SQL scripts
#  in src/main/resources/db/migration. Hibernate only validates.
#  If validation ever blocks a legitimate start-up, switch
#  spring.jpa.hibernate.ddl-auto to "none" (never to "update").
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=platform
spring.flyway.schemas=platform,ops,tripsupport,planning,crew,camo,safety,sales,refdata
spring.flyway.create-schemas=true
# Deliberately false: with baselining on, Flyway would silently mark a
# non-empty schema as already migrated and skip V1-V8. A state problem should
# fail loudly here rather than surface later as a missing table.
spring.flyway.baseline-on-migrate=false

# ============================================================
#  JPA / Hibernate
#  No global default_schema: every entity declares its own
#  schema (ops, tripsupport, crew, camo, refdata) as in the
#  target architecture (A2 — one schema per domain).
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================
#  Cache — two levels
#  L1 Caffeine (in-process, microsecond reads)
#  L2 Redis    (shared between instances, survives a restart)
#  See config/cache/TwoLevelCacheManager.
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
# Redis is used as a cache, not as a repository store. Without this, Spring
# Data Redis scans every JPA repository looking for @RedisHash entities and
# logs a paragraph per interface at start-up.
spring.data.redis.repositories.enabled=false

netplus.cache.enabled=true
netplus.cache.l1-maximum-size=10000
netplus.cache.l1-ttl=PT2M
netplus.cache.l2-ttl=PT30M
netplus.cache.key-prefix=netplus:
# Caches that hold reference data change rarely -> longer L2 TTL
netplus.cache.ttl-overrides.airports=PT12H
netplus.cache.ttl-overrides.aircraftTypes=PT12H
netplus.cache.ttl-overrides.fleet=PT5M
netplus.cache.ttl-overrides.dispatchBoard=PT20S

# ============================================================
#  Async — virtual-thread executor used by @Async and by the
#  dispatch board fan-out.
# ============================================================
netplus.async.thread-name-prefix=netplus-async-

# ============================================================
#  Tenant (authentication is not wired yet — see SecurityConfig)
#  The tenant is read from the X-Tenant-Id header and falls back
#  to this demo tenant so the front end works out of the box.
# ============================================================
netplus.tenant.default-id=00000000-0000-0000-0000-000000000001
netplus.tenant.header=X-Tenant-Id

# CORS for the Vite dev server
netplus.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# ============================================================
#  OpenAPI / Swagger UI  -> http://localhost:8080/swagger-ui.html
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  Jackson
# ============================================================
#  Spring Boot 4 embarque Jackson 3 (tools.jackson) : les bascules date/heure
#  ont quitte SerializationFeature pour l'enum DateTimeFeature, d'ou le prefixe
#  spring.jackson.datatype.datetime.* ci-dessous.
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============================================================
#  Logging
# ============================================================
logging.level.com.thenetworkplan.networkplan=DEBUG
logging.level.org.hibernate.SQL=INFO

# ============================================================
#  Meteo — une seule porte d'entree pour tout le produit
#  (annexe A4). La source par defaut est le service public de
#  la NOAA : pas de cle, donc pas de secret dans une source.
#
#  Pour passer au relais AVWX : mettre le fournisseur a AVWX et
#  poser le jeton en variable d'environnement, jamais ici.
#    setx NETPLUS_WEATHER_AVWXTOKEN "..."
#  Pour couper toute source : NONE — les ecrans afficheront
#  alors « no source connected », ce qui est la verite.
# ============================================================
netplus.weather.provider=NOAA
netplus.weather.noaa-base-url=https://tgftp.nws.noaa.gov/data/observations/metar/stations
netplus.weather.refresh-after=PT10M
netplus.weather.stale-after=PT90M
netplus.weather.timeout=PT6S
