spring.application.name=networkplan
server.port=8080

# ============================================================
#  PostgreSQL 18  (pgAdmin 4 -> Servers -> PostgreSQL 18)
#  Override the password without touching this file:
#    setx DB_PASSWORD "yourPassword"
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/networkplan
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=networkplan-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ============================================================
#  Redis  (spring-boot-starter-data-redis is on the classpath)
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================================
#  Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ============================================================
#  OpenAPI / Swagger UI  -> http://localhost:8080/swagger-ui.html
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
#  Logging
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
